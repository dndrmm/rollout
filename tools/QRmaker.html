<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spring Cove Car Pickup Flyers (v3)</title>
    <style>
        /* Base styling */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #eef2f5;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* The upload section at the top */
        #upload-section {
            text-align: center;
            padding: 30px;
            background-color: #fff;
            border-bottom: 2px solid #ddd;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        #upload-section h2 {
            margin-top: 0;
            color: #2c3e50;
        }

        .upload-btn {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 10px;
        }

        /* Center the flyers on the screen */
        #page-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px 20px 20px;
        }

        /* Each flyer is exactly half a US Letter page in landscape orientation */
        .flyer {
            width: 8.5in;
            height: 5.5in;
            background: white;
            box-sizing: border-box;
            padding: 0.3in;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Inner card styling for a modern, friendly look */
        .flyer-inner {
            border: 4px solid #2c3e50;
            border-radius: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Add a light cutting guide between the top and bottom flyers */
        .flyer:nth-child(odd) {
            border-bottom: 1px dashed #bbb;
        }

        /* Force a page break after every second flyer */
        .flyer:nth-child(even) {
            page-break-after: always;
            border-bottom: none;
            margin-bottom: 30px;
        }

        /* Main School Header */
        .school-header {
            font-size: 20pt;
            font-weight: 800;
            color: #2c3e50;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 3px solid #eee;
            padding: 15px 0;
            width: 100%;
            text-align: center;
        }

        /* Container for the two-column layout */
        .content-columns {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Left-side Text Column */
        .text-column {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 10px 0 10px 30px;
        }

        .student-name {
            font-size: 50pt;
            font-weight: 900;
            color: #000;
            margin: 0;
            line-height: 1.0;
        }

        .teacher-grade {
            font-size: 22pt;
            font-weight: 600;
            color: #555;
            margin: 5px 0 0 0;
        }

        /* Right-side QR Column */
        .qr-column {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-right: 30px;
        }

        /* Scaled up QR code */
        .qr-image {
            width: 280px; /* Increased from 250px */
            height: 280px;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            background: white;
        }

        /* Print-specific rules */
        @media print {
            #upload-section {
                display: none;
            }
            body {
                background-color: white;
            }
            #page-container {
                padding: 0;
                display: block;
            }
            .flyer {
                box-shadow: none;
            }
            .flyer:nth-child(even) {
                margin-bottom: 0;
            }
            .flyer-inner {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <div id="upload-section">
        <h2>Spring Cove Dismissal Sign Generator (v3)</h2>
        <p>Format required: Column A (Student Name), Column B (Teacher/Grade)</p>
        <input type="file" id="csvFileInput" class="upload-btn" accept=".csv">
    </div>

    <div id="page-container"></div>

    <script>
        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            reader.onload = function(event) {
                const text = event.target.result;
                generateFlyers(text);
            };

            reader.readAsText(file);
        });

        function generateFlyers(csvText) {
            const container = document.getElementById('page-container');
            container.innerHTML = '';

            const rows = csvText.split(/\r?\n/);

            rows.forEach(row => {
                if (!row.trim()) return;
                const columns = row.split(',');

                if (columns.length >= 2) {
                    const studentName = columns[0].trim();
                    const teacherGrade = columns[1].trim();

                    // Stripped out all labels, just raw data with a space
                    const qrText = `${studentName} ${teacherGrade}`;
                    const safeData = encodeURIComponent(qrText);

                    // Requesting a larger 350x350 image from the API to stay sharp
                    const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=${safeData}`;

                    const flyerDiv = document.createElement('div');
                    flyerDiv.className = 'flyer';

                    flyerDiv.innerHTML = `
                        <div class="flyer-inner">
                            <div class="school-header">Spring Cove Elementary - Car Pickup</div>

                            <div class="content-columns">
                                <div class="text-column">
                                    <div class="student-name">${studentName}</div>
                                    <div class="teacher-grade">${teacherGrade}</div>
                                </div>

                                <div class="qr-column">
                                    <img class="qr-image" src="${qrImageUrl}" alt="QR Code for ${studentName}">
                                </div>
                            </div>
                        </div>
                    `;

                    container.appendChild(flyerDiv);
                }
            });
        }
    </script>
</body>
</html>
